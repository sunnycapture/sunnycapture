<style>

body{
margin:0;
padding:40px;
font-family:Arial;
background:linear-gradient(135deg,#1a1f3c,#0d1124,#3c1e5d);
background-size:400% 400%;
animation:gradientBG 12s ease infinite;
}

@keyframes gradientBG{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

h2{
color:white;
text-align:center;
margin-bottom:40px;
}

.card{
border:none;
border-radius:15px;
overflow:hidden;
background:#ffffff10;
backdrop-filter:blur(6px);
border:1px solid rgba(255,255,255,0.1);
box-shadow:0 10px 25px rgba(0,0,0,0.4);
transition:0.3s;
}

.card:hover{
transform:translateY(-8px);
box-shadow:0 20px 35px rgba(0,0,0,0.55);
}

.card img{
height:220px;
object-fit:cover;
}

.card-body{
text-align:center;
color:white;
}

.btn-view{
display:inline-block;
margin-top:10px;
padding:8px 18px;
background:linear-gradient(90deg,#7b3aed,#5f2eea);
color:white;
border-radius:8px;
text-decoration:none;
font-weight:600;
}

.btn-view:hover{
opacity:0.85;
}

@media(max-width:576px){

body{
padding:15px;
}

.card img{
height:180px;
}

}

</style>
</head>
