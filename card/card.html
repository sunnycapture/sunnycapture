<style>

/* BODY BACKGROUND */

body{
margin:0;
padding:40px;
font-family:Arial;
overflow-x:hidden;
background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#1a1f3c);
background-size:400% 400%;
animation:bgMove 15s ease infinite;
}

/* GRADIENT ANIMATION */

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* FLOATING GLOW CIRCLES */

body::before,
body::after{
content:"";
position:fixed;
width:500px;
height:500px;
border-radius:50%;
background:radial-gradient(circle,rgba(255,255,255,0.15),transparent);
animation:float 12s linear infinite;
z-index:-1;
}

body::before{
top:-100px;
left:-150px;
}

body::after{
bottom:-150px;
right:-150px;
animation-duration:18s;
}

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(60px)}
100%{transform:translateY(0)}
}

/* TITLE */

h2{
color:white;
text-align:center;
margin-bottom:40px;
font-weight:600;
letter-spacing:1px;
}

/* CARD STYLE */

.card{
border:none;
border-radius:18px;
overflow:hidden;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(8px);
border:1px solid rgba(255,255,255,0.15);
box-shadow:0 10px 25px rgba(0,0,0,0.4);
transition:0.35s;
}

.card:hover{
transform:translateY(-10px) scale(1.02);
box-shadow:0 20px 45px rgba(0,0,0,0.65);
}

/* IMAGE */

.card img{
height:220px;
object-fit:cover;
transition:0.4s;
}

.card:hover img{
transform:scale(1.05);
}

/* CARD TEXT */

.card-body{
text-align:center;
color:white;
}

/* BUTTON */

.btn-view{
display:inline-block;
margin-top:10px;
padding:9px 20px;
background:linear-gradient(90deg,#7b3aed,#5f2eea);
color:white;
border-radius:10px;
text-decoration:none;
font-weight:600;
transition:0.3s;
position:relative;
overflow:hidden;
}

/* HOVER GLOW */

.btn-view:hover{
transform:scale(1.05);
box-shadow:0 0 15px #7b3aed;
}

/* CLICK ANIMATION */

.btn-view:active{
transform:scale(0.92);
box-shadow:0 0 25px #7b3aed;
}

/* MOBILE */

@media(max-width:576px){

body{
padding:15px;
}

.card img{
height:180px;
}

}

</style>
</head>
