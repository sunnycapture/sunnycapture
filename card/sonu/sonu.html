\<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SM Gallery</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#000;
color:white;
}

/* Header */

header{
text-align:center;
padding:25px;
font-size:28px;
letter-spacing:4px;
}

/* Gallery */

.gallery{

max-width:1200px;
margin:auto;
padding:20px;

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;

}

/* Images */

.gallery img{

width:100%;
height:250px;
object-fit:cover;

border-radius:8px;

cursor:pointer;

transition:0.3s;

}

.gallery img:hover{

transform:scale(1.05);

}

/* Popup */

.popup{

position:fixed;
top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,0.95);

display:none;

align-items:center;
justify-content:center;

z-index:1000;

}

/* Popup Image */

.popup img{

max-width:90%;
max-height:90%;

border-radius:10px;

}

/* Close Button */

.close{

position:absolute;

top:30px;
right:40px;

font-size:40px;

color:white;

cursor:pointer;

}

</style>

</head>

<body>

<header>
SM Gallery
</header>


<div class="gallery">

<img src="1.jpg">
<img src="2.jpg">
<img src="3.png">
<img src="4.png">
<img src="5.png">
<img src="6.png">
<img src="7.png">
<img src="8.png">
<img src="9.png">
<img src="10.png">
<img src="11.png">
<img src="12.png">

</div>


<!-- Popup -->

<div class="popup" id="popup">

<span class="close" onclick="closePopup()">×</span>

<img id="popupImg">

</div>


<script>

/* Select elements */

const images = document.querySelectorAll(".gallery img");
const popup = document.getElementById("popup");
const popupImg = document.getElementById("popupImg");


/* Click image */

images.forEach(img => {

img.addEventListener("click", () => {

popup.style.display = "flex";

popupImg.src = img.src;

});

});


/* Close popup */

function closePopup(){

popup.style.display = "none";

}


/* Click outside image */

popup.addEventListener("click",(e)=>{

if(e.target !== popupImg){

popup.style.display="none";

}

});


/* ESC key close */

document.addEventListener("keydown",(e)=>{

if(e.key === "Escape"){

popup.style.display="none";

}

});

</script>

</body>

</html>
